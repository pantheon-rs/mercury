[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "faer transitively requires paste, including in faer 0.24.4. This is a maintenance-only advisory with no patched version; remove this exception when faer removes paste." },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
