[package]
name = "mercury-macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compiled differentiable kernels for Mercury."
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
